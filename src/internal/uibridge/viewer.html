<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>gamesense · 只读观看</title><link rel="stylesheet" href="/viewer.css"><script src="/atlas-core.js" defer></script><script src="/viewer-core.js" defer></script><script src="/viewer.js" defer></script></head>
<body><header><strong>gamesense</strong><span>READ ONLY / 只读观看</span><output id="status" role="status">正在验证观看权限</output></header>
<main><section id="screen" tabindex="0" aria-label="雷达视口；单指拖动，双指缩放"><canvas id="radar" aria-label="已授权绘图数据"></canvas><p id="empty">等待主机的有效画面</p></section>
<section class="toolbar" aria-label="观看控制"><div class="map"><b id="map">等待地图</b><span id="count">人物 0 / 声音 0</span></div><div class="buttons"><button id="minus" aria-label="缩小">−</button><output id="zoom">100%</output><button id="plus" aria-label="放大">＋</button><button id="center">居中</button><label><input id="names" type="checkbox" checked>名字</label></div><div class="follow"><select id="target" aria-label="选择跟随人物"><option value="">选择人物</option></select><button id="follow">跟随</button><button id="stop">停止跟随</button></div><p id="hint">仅观看当前主机地图；不能采集、换图或编辑。T 金色 / CT 蓝色 / 声音灰圈。</p></section></main>
</body></html>
